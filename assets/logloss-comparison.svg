<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1200" height="590" viewBox="0 0 1200 590"><title id="title">Reported test log-loss by model variant</title><desc id="desc">Lower log-loss is better. Full TreeFed-CERT+ 0.0089, teacher mix only 0.0190, uniform mixing 0.0195, without bandit signal 0.0201, and without nested cross-validation 0.0211.</desc><rect width="1200" height="590" fill="#f8fafc"/><text x="44" y="65" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#10233f">Why the full pipeline matters</text><text x="44" y="105" font-family="Arial,sans-serif" font-size="19" fill="#52627a">Reported held-out test log-loss by model variant · lower is better</text><text x="45" y="186" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1d3452">Full TreeFed-CERT+</text><rect x="374" y="157" width="665" height="44" rx="8" fill="#e6ebf1"/><rect x="374" y="157" width="233.2" height="44" rx="8" fill="#168c83"/><text x="622.18" y="186" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1d3452">0.0089</text><text x="45" y="265" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#1d3452">Teacher mix only</text><rect x="374" y="236" width="665" height="44" rx="8" fill="#e6ebf1"/><rect x="374" y="236" width="497.8" height="44" rx="8" fill="#7f93ad"/><text x="886.8" y="265" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1d3452">0.0190</text><text x="45" y="344" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#1d3452">Uniform mixing</text><rect x="374" y="315" width="665" height="44" rx="8" fill="#e6ebf1"/><rect x="374" y="315" width="510.9" height="44" rx="8" fill="#7f93ad"/><text x="899.8999999999999" y="344" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1d3452">0.0195</text><text x="45" y="423" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#1d3452">Without bandit signal</text><rect x="374" y="394" width="665" height="44" rx="8" fill="#e6ebf1"/><rect x="374" y="394" width="526.6" height="44" rx="8" fill="#7f93ad"/><text x="915.62" y="423" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1d3452">0.0201</text><text x="45" y="502" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#1d3452">Without nested CV</text><rect x="374" y="473" width="665" height="44" rx="8" fill="#e6ebf1"/><rect x="374" y="473" width="552.8" height="44" rx="8" fill="#7f93ad"/><text x="941.8199999999999" y="502" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1d3452">0.0211</text><text x="44" y="566" font-family="Arial,sans-serif" font-size="15" fill="#52627a">Source: camera-ready TreeFed-CERT+ manuscript, Table IV. These are paper-reported results, not independently reproduced here.</text></svg>