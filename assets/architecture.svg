<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1360" height="625" viewBox="0 0 1360 625"><title id="title">TreeFed-CERT+ workflow</title><desc id="desc">IFPE dataset is divided into training and test sets, four simulated clients train Extra Trees with nested validation, CERT+ mixes teacher probabilities using reliability, bandit, and KL signals, and a histogram gradient boosting student is evaluated and explained using SHAP, LIME, and partial dependence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58718f"/></marker></defs><style>
  .bg{fill:#f8fafc}.headline{font:700 34px Arial,sans-serif;fill:#10233f}.sub{font:18px Arial,sans-serif;fill:#52627a}.step{font:700 21px Arial,sans-serif;fill:#152840}.detail{font:17px Arial,sans-serif;fill:#34465f}.small{font:15px Arial,sans-serif;fill:#56677b}.arrow{stroke:#58718f;stroke-width:3;fill:none;marker-end:url(#arrow)}.footer{font:700 19px Arial,sans-serif;fill:#163e57}
</style><rect class="bg" width="1360" height="625"/><text x="35" y="67" class="headline">TreeFed-CERT+ research workflow</text><text x="35" y="105" class="sub">A simplified view of the method reported in the IEEE WCCI 2026 research manuscript</text><rect x="35" y="176" width="230" height="221" rx="17" fill="#e6f0ff" stroke="#8cb5f3" stroke-width="2"/><rect x="49" y="190" width="202" height="5" rx="3" fill="#8cb5f3"/><text x="55" y="239" class="step">Data &amp; split</text><text x="55" y="285" class="detail">IFPE Palmares traffic</text><text x="55" y="319" class="detail">362,445 cleaned rows</text><text x="55" y="353" class="detail">80% train / 20% test</text><rect x="300" y="176" width="230" height="221" rx="17" fill="#e5f7f4" stroke="#89c9bf" stroke-width="2"/><rect x="314" y="190" width="202" height="5" rx="3" fill="#89c9bf"/><text x="320" y="239" class="step">Four clients</text><text x="320" y="285" class="detail">Simulated non-IID data</text><text x="320" y="319" class="detail">Dirichlet alpha = 0.6</text><text x="320" y="353" class="detail">Different label mixtures</text><rect x="565" y="176" width="230" height="221" rx="17" fill="#f0eaff" stroke="#bca7ec" stroke-width="2"/><rect x="579" y="190" width="202" height="5" rx="3" fill="#bca7ec"/><text x="585" y="239" class="step">Local teachers</text><text x="585" y="285" class="detail">Extra Trees models</text><text x="585" y="319" class="detail">Nested cross-validation</text><text x="585" y="353" class="detail">Bernstein LCB scores</text><rect x="830" y="176" width="230" height="221" rx="17" fill="#fff1d9" stroke="#e7c083" stroke-width="2"/><rect x="844" y="190" width="202" height="5" rx="3" fill="#e7c083"/><text x="850" y="239" class="step">CERT+ mixing</text><text x="850" y="285" class="detail">Reliability + bandit</text><text x="850" y="319" class="detail">KL shift penalty</text><text x="850" y="353" class="detail">Adaptive model weights</text><rect x="1095" y="176" width="230" height="221" rx="17" fill="#e8f6e8" stroke="#a1d3aa" stroke-width="2"/><rect x="1109" y="190" width="202" height="5" rx="3" fill="#a1d3aa"/><text x="1115" y="239" class="step">Global student</text><text x="1115" y="285" class="detail">HGB tree stacking</text><text x="1115" y="319" class="detail">Encoded features +</text><text x="1115" y="353" class="detail">teacher probabilities</text><path class="arrow" d="M 267 286 L 297 286"/><path class="arrow" d="M 532 286 L 562 286"/><path class="arrow" d="M 797 286 L 827 286"/><path class="arrow" d="M 1062 286 L 1092 286"/><rect x="35" y="455" width="590" height="119" rx="15" fill="#fff" stroke="#d5e1eb" stroke-width="2"/><text x="57" y="495" class="footer">Server-only anchor: 20,000 samples</text><text x="57" y="526" class="detail">Used for model mixing, student training, and validation</text><text x="57" y="551" class="small">Not used to train client teachers</text><rect x="652" y="455" width="673" height="119" rx="15" fill="#fff" stroke="#d5e1eb" stroke-width="2"/><text x="675" y="495" class="footer">Final evaluation and explainability</text><text x="675" y="526" class="detail">Held-out test: 72,489 samples  •  SHAP, LIME, PDP</text><text x="675" y="551" class="small">Reported study uses simulated federated clients; not a deployment diagram</text></svg>